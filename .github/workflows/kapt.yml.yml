name: KAPT Alert

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kapt-alert
  cancel-in-progress: false

jobs:
  run-kapt-alert:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: KAPT 알림 실행
        env:
          KAPT_SERVICE_KEY: ${{ secrets.KAPT_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: sent_notice.json 저장
        run: |
          if [ -f sent_notice.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add sent_notice.json

            if git diff --cached --quiet; then
              echo "sent_notice.json 변경 없음"
            else
              git commit -m "Update sent notice list"
              git push
            fi
          fi
